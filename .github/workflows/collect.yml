name: 정보공시 수집·분석

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon(구조 정찰) 또는 collect(수집+분석)"
        required: true
        default: "recon"
        type: choice
        options: [openapi, browser-api, api-probe, recon, browser-recon, collect, browser-collect, download]
  schedule:
    - cron: "0 21 * * 1"   # 매주 화요일 06:00 KST — 공시 갱신 반영

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Playwright 브라우저 설치
        run: python -m playwright install --with-deps chromium
      - name: 수집 실행
        continue-on-error: true
        env:
          MODE: ${{ github.event.inputs.mode || 'browser-collect' }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          case "$MODE" in
            recon)          python crawler/collect.py recon ;;
            collect)        python crawler/collect.py collect ;;
            browser-recon)  python crawler/browse.py recon ;;
            openapi)        python crawler/collect_openapi.py ;;
            browser-api)    python crawler/browse_api.py ;;
            api-probe)      python crawler/api_probe.py ;;
            download)       python crawler/browse.py download ;;
            *)              python crawler/browse.py collect ;;
          esac
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "disclosure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "data: 정보공시 ${{ github.event.inputs.mode || 'collect' }} 결과 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
